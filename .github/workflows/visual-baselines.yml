name: Update visual baselines

# Human-triggered only. Regenerates Playwright screenshots in the CI image and commits them
# to the selected branch. Review the diff in the resulting commit before merging.
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.63.0-noble
      options: --user 1001
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm test:visual:update
      - name: Commit baselines
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/visual/__screenshots__
          # No [skip ci]: a push made with GITHUB_TOKEN never starts other workflows anyway, and the
          # marker leaks into squash-merge messages, which then skips CI on main.
          git diff --cached --quiet || git commit -m "test(visual): update baselines"
          git push
