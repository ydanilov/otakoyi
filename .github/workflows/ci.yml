name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NEXT_TELEMETRY_DISABLED: 1

jobs:
  # Fast sensors — fail early, cheap feedback.
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm tokens:check
      - name: Tokens match Figma
        run: pnpm tokens:figma:check
      - name: Code Connect templates parse
        run: pnpm figma:check
      - run: pnpm lint
      - run: pnpm format:check
      - run: pnpm typecheck
      - run: pnpm check:stories
      - run: pnpm test

  # Browser sensors run in the official Playwright image so screenshots are reproducible.
  browser:
    needs: verify
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.63.0-noble
      options: --user 1001
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - name: Storybook interaction + a11y tests
        run: pnpm test:stories
      - run: pnpm build
      - name: JS budget
        run: pnpm check:budget
      - name: E2E + axe
        run: pnpm test:e2e
      - name: Visual regression
        run: |
          if [ -d tests/visual/__screenshots__ ]; then
            pnpm test:visual
          else
            echo "::warning::No visual baselines yet — run the 'Update visual baselines' workflow."
          fi
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 7

  storybook:
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm build-storybook
      - uses: actions/upload-artifact@v4
        with:
          name: storybook-static
          path: storybook-static
          retention-days: 14
